services:
  # ---------------------------------------------------------------------------
  # 1. Slainte-Scan-MCP: Deterministic Clinical Tool Server
  # ---------------------------------------------------------------------------
  slainte-mcp:
    build:
      context: ./slainte-scan-mcp
      dockerfile: Dockerfile
    container_name: slainte-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - PORT=8081
      - MCP_TRANSPORT=sse
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    networks:
      - slainte-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/sse', timeout=3).status in (200, 400, 404, 405) else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # 2. Slainte-Dashboard: HTMX Clinical Interface & Live Triage Queue
  # ---------------------------------------------------------------------------
  slainte-dashboard:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: slainte-dashboard
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data/raw:/workspace/data/raw
      - ./data/fhir_store:/workspace/data/fhir_store
      - ./data/audit_reports:/workspace/data/audit_reports
      - ./slainte-auditor:/workspace/slainte-auditor
      - ./agents:/app/agents:ro
      - dashboard-data:/app/instance
    environment:
      - FLASK_ENV=production
      - APPLIANCE_MODE=true
      - FHIR_STORE_PATH=/workspace/data/fhir_store
      - RAW_DATA_PATH=/workspace/data/raw
      - REPORT_OUTPUT_DIR=/workspace/data/audit_reports
      - TARGET_FHIR_URL=http://slainte-fhir:8082
      - SECRET_KEY=${SECRET_KEY:-slainte-engine-production-key-99021}
      - INITIAL_ADMIN_USERNAME=${INITIAL_ADMIN_USERNAME:-admin}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-ClinicalAdmin2026!}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-ollama/k9/lime:latest}
      - HEALTH_SHOW_BACKEND=true
      - LOG_HASH_SALT=${LOG_HASH_SALT:-slainte-secure-audit-salt-2026-prod}
      - FHIR_SERVER_URL=http://slainte-fhir:8082/fhir/r4
      - OLLAMA_API_BASE=http://172.19.0.1:11435
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - slainte-net
    depends_on:
      slainte-mcp:
        condition: service_healthy
      slainte-fhir:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 3. Slainte-OpenHands: Sandboxed Clinical Ingestion Agent Engine
  # ---------------------------------------------------------------------------
  slainte-openhands:
    build:
      context: .
      dockerfile: openhands/Dockerfile
    container_name: slainte-openhands
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data/raw:/workspace/data/raw
      - ./data/fhir_store:/workspace/data/fhir_store
      - ./slainte-scan-mcp:/workspace/slainte-scan-mcp:ro
      - ./openhands:/workspace/openhands
    environment:
      - RAW_DATA_PATH=/workspace/data/raw
      - FHIR_STORE_PATH=/workspace/data/fhir_store
      - MCP_SRC_PATH=/workspace/slainte-scan-mcp
      - LLM_MODEL=${LLM_MODEL:-ollama/qwen2.5-coder:32b}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    networks:
      - slainte-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      slainte-mcp:
        condition: service_healthy
      slainte-dashboard:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 4. Slainte-FHIR: Lightweight Autonomous Clinical FHIR R4 Server
  # ---------------------------------------------------------------------------
  slainte-fhir:
    build:
      context: ./slainte-fhir
      dockerfile: Dockerfile
    container_name: slainte-fhir
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ./data/fhir_store:/app/data/fhir_store
    environment:
      - PORT=8082
      - DB_PATH=/app/data/fhir_store/fhir_store.db
      - SEED_FILE=/app/data.json
    networks:
      - slainte-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # 5. Slainte-Auditor: Autonomous Red-Team & Semantic FHIR R4 Verifier Agent
  # ---------------------------------------------------------------------------
  slainte-auditor:
    build:
      context: ./slainte-auditor
      dockerfile: Dockerfile
    container_name: slainte-auditor
    restart: unless-stopped
    volumes:
      - ./data/fhir_store:/workspace/data/fhir_store:ro
      - ./data/audit_reports:/workspace/data/audit_reports
    environment:
      - TARGET_FHIR_URL=http://slainte-fhir:8082
      - MCP_SERVER_URL=http://slainte-mcp:8081
      - FHIR_STORE_PATH=/workspace/data/fhir_store
      - REPORT_OUTPUT_DIR=/workspace/data/audit_reports
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-6.1-luna}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434}
    networks:
      - slainte-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      slainte-fhir:
        condition: service_healthy
      slainte-mcp:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 6. Slainte-Ingress: Caddy 2 Automated TLS Reverse Proxy
  # ---------------------------------------------------------------------------
  slainte-ingress:
    image: caddy:2-alpine
    container_name: slainte-ingress
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - slainte-net
    depends_on:
      slainte-dashboard:
        condition: service_healthy
      slainte-fhir:
        condition: service_healthy

volumes:
  dashboard-data:
  caddy-data:
  caddy-config:

networks:
  slainte-net:
    driver: bridge
